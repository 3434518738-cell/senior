<rect x="450" y="212" width="500" height="68" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
<text x="700" y="256" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172033">Bottles are sorted</text>
<line x1="700" y1="281" x2="700" y2="315" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="450" y="317" width="500" height="68" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
<text x="700" y="361" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172033">Bottles are washed</text>
<line x1="700" y1="386" x2="700" y2="420" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="450" y="422" width="500" height="68" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
<text x="700" y="466" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172033">Plastic is crushed</text>
