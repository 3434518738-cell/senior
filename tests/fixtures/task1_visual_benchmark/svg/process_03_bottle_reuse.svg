<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="870" viewBox="0 0 1400 870">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<text x="700" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#172033">Plastic bottle recycling with a branch</text>
<rect x="450" y="107" width="500" height="68" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
<text x="700" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172033">Bottles are collected</text>
