<rect x="450" y="527" width="500" height="68" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
<text x="700" y="571" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172033">Plastic is recycled</text>
