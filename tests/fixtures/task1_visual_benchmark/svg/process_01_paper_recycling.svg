<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<text x="700" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#172033">Paper recycling process</text>
<rect x="450" y="107" width="500" height="68" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
<text x="700" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172033">Used paper is collected</text>
<line x1="700" y1="176" x2="700" y2="210" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="450" y="212" width="500" height="68" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
<text x="700" y="256" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172033">Paper is sorted</text>
<line x1="700" y1="281" x2="700" y2="315" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="450" y="317" width="500" height="68" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
<text x="700" y="361" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172033">Paper is pulped</text>
<line x1="700" y1="386" x2="700" y2="420" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="450" y="422" width="500" height="68" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
<text x="700" y="466" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172033">New paper is produced</text>
</svg>